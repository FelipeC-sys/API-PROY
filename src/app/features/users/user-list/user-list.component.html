<div class="page">
  <div class="page-header">
    <div>
      <h1>Usuarios</h1>
      <p class="page-sub">{{ users().length }} en total</p>
    </div>
  </div>

  @if (loading()) {
    <p class="page-sub">Cargando...</p>
  }
  @if (errorMessage()) {
    <p class="form-error">{{ errorMessage() }}</p>
  }

  @if (users().length > 0) {
    <div class="card">
      <table class="data-table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Rol</th>
          </tr>
        </thead>
        <tbody>
          @for (user of users(); track user.id) {
            <tr>
              <td>{{ user.name }}</td>
              <td class="muted">{{ user.email }}</td>
              <td>
                <select
                  [ngModel]="user.role"
                  (ngModelChange)="changeRole(user, $event)"
                  [disabled]="savingUserId() === user.id"
                >
                  @for (r of roles; track r) {
                    <option [value]="r">{{ r }}</option>
                  }
                </select>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
